# Build, test and package-verify the offline installer.
#
# WHY THIS EXISTS SEPARATELY FROM build.yml. Until 2026-08-29 the only workflow in this repo
# packed NuGet packages: it pinned .NET 8, ran on ubuntu-latest, and never built the installer,
# never ran a test, and never produced a payload. A commit could therefore break the product
# and go green. That is not a gap in coverage, it is the absence of CI for the thing the
# repository is for.
#
# WHAT THIS GUARDS, deliberately and in this order:
#   1. The SDK pin holds       - global.json 10.0.302, the same pin as the L2-R2 workspace
#   2. Both solutions build    - with TreatWarningsAsErrors and AnalysisLevel 10.0-recommended
#   3. The tests pass          - all of them, both solutions
#   4. No known vulnerability  - NuGet.Config sets auditLevel=high; restore must be clean
#   5. Windows publish works   - the self-contained win-x64 path from ADR-0007, on a real
#                                Windows runner, because that is the only place the produced
#                                artefact is the artefact that ships

name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

env:
  DOTNET_NOLOGO: "true"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"

jobs:
  build-and-test:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Linux is the fast gate. Windows is not optional: this product installs Windows
        # services, resolves NTFS junctions and reads the registry, so a green Linux build
        # proves the code compiles, not that it is buildable for the target.
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      # No dotnet-version here on purpose. global.json is the single pin; naming a version in
      # the workflow too is how the two drift and how "works in CI" stops meaning anything.
      - name: Set up .NET from global.json
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Report the resolved SDK
        run: dotnet --info

      # Restore is a gate in its own right: NuGet.Config sets auditMode=all and
      # auditLevel=high, so a dependency with a known high-severity advisory fails here.
      - name: Restore (installer)
        run: dotnet restore ePACS.Installer.sln

      - name: Restore (harness)
        run: dotnet restore harness/ePACS.SyncHarness.sln

      - name: Build (installer)
        run: dotnet build ePACS.Installer.sln -c Release --no-restore

      - name: Build (harness)
        run: dotnet build harness/ePACS.SyncHarness.sln -c Release --no-restore

      - name: Test (installer)
        run: dotnet test ePACS.Installer.sln -c Release --no-build --logger "trx;LogFileName=installer.trx" --results-directory artifacts/test-results

      # Contract tests only. The integration, chaos and long-offline suites need Docker and are
      # not wired here yet - see tasks.md W9. Listing them as "run" when they do not run is the
      # exact failure mode this repository's status records were corrected for.
      - name: Test (harness contract tests)
        run: dotnet test harness/tests/Harness.ContractTests/Harness.ContractTests.csproj -c Release --no-build --logger "trx;LogFileName=harness-contract.trx" --results-directory artifacts/test-results

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: artifacts/test-results
          if-no-files-found: warn
          retention-days: 14

  publish-win-x64:
    name: Publish win-x64 payload
    needs: build-and-test
    runs-on: windows-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET from global.json
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # ADR-0007 §1: self-contained, single-file win-x64. This step is what turns that ADR from
      # a description into something verified - it is the first point at which the repository
      # produces an artefact of the shape that would actually go onto removable media.
      # The RID is passed by the publish step, not baked into Directory.Build.props - see the
      # note there. This is the only place the shipping artefact shape is decided.
      - name: Publish harness payload (self-contained win-x64)
        shell: pwsh
        run: ./harness/scripts/publish-win-x64.ps1 -CreateZip

      # The installer CLI stays SELF-CONTAINED, deliberately, and it is the one thing that
      # should be: it is what runs before any runtime has been installed on the node. Everything
      # it installs is framework-dependent per ADR-0009; the bootstrap itself cannot be.
      - name: Publish installer CLI (self-contained win-x64 — the bootstrap exception)
        shell: pwsh
        run: >
          dotnet publish src/Installer.CLI/Installer.CLI.csproj -c Release -r win-x64
          --self-contained true -p:PublishSingleFile=true -o artifacts/publish/installer

      # Size is a shipping constraint, not trivia: this goes onto a USB stick carried to a
      # rural site, and ADR-0009 turns on a 2.6 GB measurement. Print it every run so growth is
      # visible in the log before it is a problem.
      - name: Report artefact sizes
        shell: pwsh
        run: |
          Get-ChildItem -Recurse artifacts/publish, harness/publish -Include *.exe,*.zip -ErrorAction SilentlyContinue |
            Select-Object FullName, @{n='MB';e={[math]::Round($_.Length/1MB,1)}} |
            Sort-Object MB -Descending | Format-Table -AutoSize

      - name: Upload publish artefacts
        uses: actions/upload-artifact@v4
        with:
          name: win-x64-publish
          path: |
            artifacts/publish/**
            harness/publish/*.zip
          if-no-files-found: error
          retention-days: 14
