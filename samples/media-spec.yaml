# ePACS media spec — what goes on the stick, and what release it is.
#
# A FILE RATHER THAN COMMAND-LINE FLAGS, deliberately. A medium is a released artefact and its
# composition should be reviewable in a diff: "why does this build carry Kafka?" ought to be
# answerable from git history, not from a CI log.
#
# Build it with:
#   dotnet run --project src/Installer.MediaBuilder -- build \
#     --spec samples/media-spec.yaml --out artifacts/medium --groups core,cache \
#     --pfx <signing.pfx>          # EPACS_PFX_PASSWORD in the environment
#
# The builder measures every hash from the file beside it, writes the manifest, signs it, and
# then verifies the whole medium with the INSTALLER'S OWN verifier before declaring success.
# Nothing here is hand-typed the way samples/release-manifest.yaml's hashes were.

release:
  stack_version: "3.3.0"
  schema_version: 25
  min_os_build: 17763
  installer_tool_version: "4.0.0"
  created_by: "ci"

  # Left empty here: this sample builds an UNSIGNED development medium. A release sets the
  # thumbprint of the certificate it will be signed with, and the node pins the same value in
  # Installer:ExpectedSigningThumbprint — which is the trust anchor, because the manifest's own
  # declaration is self-asserted and worthless against an attacker who re-signs.
  signing_cert_thumbprint: ""

  # Set for a hotfix, to the release this one patches.
  hotfix_base_version: null

payloads:
  # GROUPS match the service map's, so a component switched off is not carried at all rather
  # than shipped and ignored. `eventing` is ~290 MB of Kafka and JRE for something no deployment
  # in the L2-R2 estate provisions — see ADR-0003.
  #
  # Sources are relative to THIS FILE. Publish before building: the builder will not emit a
  # manifest entry for something it cannot hash.

  - name: "installer-agent"
    source: "../packaging/config-templates"
    install_order: 10
    required: true
    group: "core"

  - name: "error-catalog"
    source: "../packaging/error-catalog"
    install_order: 20
    required: true
    group: "core"

  # NOTE: the schema payload is NOT sampled here, deliberately. The estate's single schema
  # authority is db/stable_baseline_ddl.sql in the L2-R2 workspace — not this repository, and
  # emphatically not docs/AP_DDL.sql, which is a stale mysqldump of MHCluster3 and should be
  # deleted. A real spec points at the workspace's copy:
  #
  #   - name: "baseline-schema"
  #     source: "../../db/stable_baseline_ddl.sql"
  #     install_order: 25
  #     group: "core"

# Real releases add, in install order: vc-redist, mysql, the cache (garnet or redis), the .NET
# runtime (ADR-0009 — framework-dependent payload, so the runtime ships ONCE rather than being
# bundled into each of 26 services), epacs-services, and percona-toolkit. They are omitted from
# this sample because none of them is in the repository; a spec that referenced them would fail
# the build with "does not exist", which is the correct behaviour and a poor sample.

compatibility:
  min_upgrade_from: "3.2.0"
  max_upgrade_from: "3.2.9"
  requires_side_by_side: false
  breaking_schema_change: false
